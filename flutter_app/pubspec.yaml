name: myapp
description: "A new Flutter project."
publish_to: 'none'

# Semantic application version + build number.
# Keep the semantic version immutable for a released application version;
# CI may supply the build number separately for each build.
version: 0.1.0+14

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
