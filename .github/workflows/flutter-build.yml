name: Flutter Build + Repository Gate

on:
  push:
    branches: [main, feature/repo-inspector]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP: flutter_app
  FLUTTER_VERSION: '3.24.3'

jobs:
  validate:
    name: Flutter + Python validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter dependencies
        working-directory: ${{ env.APP }}
        run: flutter pub get

      - name: Flutter analyze
        working-directory: ${{ env.APP }}
        run: flutter analyze

      - name: Flutter tests
        working-directory: ${{ env.APP }}
        run: flutter test

      - name: Python inspector tests
        run: python -m unittest discover -s tools/repo_inspector/tests -v

      - name: Code Writer safe-plan validation
        run: python tools/code_writer/main.py . --spec tools/code_writer/example.json --plan

      - name: Repository inspection
        run: python tools/repo_inspector/main.py .

      - name: Build Web
        working-directory: ${{ env.APP }}
        run: flutter build web --release

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-${{ github.run_number }}
          path: flutter_app/build/web/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload repository inspection reports
        uses: actions/upload-artifact@v4
        with:
          name: repo-inspector-${{ github.run_number }}
          path: reports/repo-inspector/**
          if-no-files-found: error
          retention-days: 14

  android-build:
    name: Android APK build
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter dependencies
        working-directory: ${{ env.APP }}
        run: flutter pub get

      - name: Build Android APK
        working-directory: ${{ env.APP }}
        run: flutter build apk --release --build-number ${{ github.run_number }}

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-android-${{ github.run_number }}
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  final-gate:
    name: Final Gate
    needs: [validate, android-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate passed
        run: echo "Flutter validation, Python inspection, Code Writer safe-plan, Web build, and Android build passed."
