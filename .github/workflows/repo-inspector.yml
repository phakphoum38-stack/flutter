name: Repository Inspector

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-inspector-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s tools/repo_inspector/tests -v

      - name: Inspect repository
        run: python tools/repo_inspector/main.py . --fail-on-secret-like

      - name: Upload inspection reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-inspector-report-${{ github.run_number }}
          path: reports/repo-inspector/
          if-no-files-found: error
          retention-days: 14
