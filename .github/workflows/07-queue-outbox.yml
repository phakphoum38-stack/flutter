name: 07 Queue Outbox

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check queue/outbox contract references
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'queue|outbox|ack|retry|dlq' README.md .github 2>/dev/null | head -n 20 || true
      - name: Emit required invariants
        run: |
          echo 'Queue delivery must be durable.'
          echo 'ACK/NACK must be idempotent.'
          echo 'Retries must be bounded and DLQ-capable.'
